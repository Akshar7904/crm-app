<!-- Impersonation Banner — shown when SUPERADMIN is viewing a company -->
<div class="impersonation-banner" *ngIf="isImpersonating">
  <i class="bi bi-eye-fill me-2"></i>
  Viewing as <strong>{{ impersonatedCompanyName }}</strong>
  <button class="btn btn-sm btn-light ms-3" (click)="exitImpersonation()">
    <i class="bi bi-arrow-return-left me-1"></i>Return to Super-Admin
  </button>
</div>

<nav class="navbar">
  <div class="navbar-container">

    <!-- LEFT: Logo (mobile) + Hamburger (tablet) -->
    <div class="navbar-left">
      <!-- Mobile logo — shown on phones only, replaces hamburger -->
      <a routerLink="/home" class="mobile-nav-logo">
        <img src="assets/enterprise360-icon.png" alt="Enterprise360" class="mobile-nav-logo-img">
      </a>
      <!-- Hamburger — shown on tablet only (768–992px range) -->
      <button
        class="hamburger-btn tablet-only"
        type="button"
        aria-label="Toggle sidebar"
        (click)="onToggleSidebar()"
      >
        <div class="hamburger-icon" [class.active]="!sidebarCollapsed">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </button>
    </div>

    <!-- RIGHT: Actions & Profile -->
    <div class="navbar-right">

      <!-- Notifications -->
      <app-notification-dropdown></app-notification-dropdown>

      <!-- Announcements -->
      <a
        [routerLink]="['/announcements']"
        class="nav-action-btn"
        title="Announcements"
      >
        <i class="bi bi-megaphone"></i>
      </a>

      <!-- Divider -->
      <div class="navbar-divider d-none d-lg-block"></div>

      <!-- User Profile -->
      <div class="dropdown user-dropdown">
        <button
          class="btn user-profile-btn dropdown-toggle"
          type="button"
          data-bs-toggle="dropdown"
          aria-expanded="false"
        >
          <img
            class="user-avatar"
            [src]="getProfileImageUrl()"
            (error)="onProfileImageError($event)"
            [alt]="user?.firstName"
          />

          <div class="user-info d-none d-lg-flex">
            <span class="user-name">
              {{ user?.firstName }} {{ user?.lastName }}
            </span>
            <span class="user-role">{{ user?.roleName || 'Employee' }}</span>
          </div>

          <i class="bi bi-chevron-down dropdown-arrow d-none d-lg-block"></i>
        </button>

        <ul class="dropdown-menu dropdown-menu-end">
          <li class="dropdown-header">
            <div class="user-header-info">
              <div class="user-header-avatar-wrapper">
                <img
                  class="user-header-avatar"
                  [src]="getProfileImageUrl()"
                  (error)="onProfileImageError($event)"
                />
                <span class="avatar-status-dot"></span>
              </div>
              <div>
                <span class="user-header-name">
                  {{ user?.firstName }} {{ user?.lastName }}
                </span>
                <span class="user-header-email">
                  {{ user?.email }}
                </span>
              </div>
            </div>
          </li>

          <li><hr class="dropdown-divider" /></li>

          <li class="dropdown-section-label">Account</li>
          <li>
            <a class="dropdown-item" [routerLink]="['/profile']">
              <i class="bi bi-person-circle"></i>
              My Profile
            </a>
          </li>

          <li><hr class="dropdown-divider" /></li>

          <li class="dropdown-section-label">Layout</li>
          <li class="layout-switcher">
            <button type="button" class="layout-switch-btn" [class.active]="(layoutMode$ | async) === 'sidebar'" (click)="setLayoutMode('sidebar')">
              <i class="bi bi-layout-sidebar"></i>
              Sidebar
            </button>
            <button type="button" class="layout-switch-btn" [class.active]="(layoutMode$ | async) === 'topnav'" (click)="setLayoutMode('topnav')">
              <i class="bi bi-menu-up"></i>
              Top Nav
            </button>
          </li>

          <li><hr class="dropdown-divider" /></li>

          <li *ngIf="isImpersonating">
            <a class="dropdown-item impersonate-exit-item" (click)="exitImpersonation()">
              <i class="bi bi-arrow-return-left"></i>
              Exit — Return to Super-Admin
            </a>
          </li>

          <li *ngIf="isImpersonating"><hr class="dropdown-divider" /></li>

          <li>
            <a class="dropdown-item logout-item" (click)="logOut()">
              <i class="bi bi-box-arrow-right"></i>
              Sign Out
            </a>
          </li>
        </ul>
      </div>
    </div>

  </div>

  <!-- Bottom accent line -->
  <div class="navbar-accent"></div>
</nav>
