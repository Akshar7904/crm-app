<!-- Navbar rendered by app.component -->
<section class="asset-form-page">
  <div class="container-fluid">

    <!-- Page Banner -->
    <div class="page-banner">
      <div class="banner-left">
        <h1 class="banner-title">
          <i class="bi {{ isEditMode ? 'bi-pencil-square' : 'bi-plus-circle' }}"></i>
          {{ isEditMode ? 'Edit Asset' : 'Add New Asset' }}
        </h1>
        <p class="banner-subtitle">
          <a [routerLink]="['/assets']" class="text-white-50 text-decoration-none">Assets</a>
          <i class="bi bi-chevron-right mx-1" style="font-size:0.7rem;opacity:0.6"></i>
          {{ isEditMode ? 'Edit' : 'New Asset' }}
        </p>
      </div>
      <div class="banner-actions">
        <button type="button" class="btn-banner btn-banner-ghost" (click)="cancel()">
          <i class="bi bi-x-lg"></i> Cancel
        </button>
      </div>
    </div>

    <!-- Compact Form Card -->
    <div class="falcon-card asset-form-card">
      <form [formGroup]="assetForm" (ngSubmit)="onSubmit()">

        <!-- Section: Identity -->
        <div class="form-section">
          <div class="form-section-label"><i class="bi bi-tag"></i> Identity</div>
          <div class="form-grid form-grid-3">
            <div class="form-field">
              <label for="assetTag" class="form-label">Asset Tag <span class="text-danger">*</span></label>
              <input type="text" id="assetTag" formControlName="assetTag" class="form-control"
                [ngClass]="{'is-invalid': isFieldInvalid('assetTag')}" placeholder="e.g., LAP-001" />
              <div class="invalid-feedback">Required (min 3 chars)</div>
            </div>
            <div class="form-field col-span-2">
              <label for="name" class="form-label">Asset Name <span class="text-danger">*</span></label>
              <input type="text" id="name" formControlName="name" class="form-control"
                [ngClass]="{'is-invalid': isFieldInvalid('name')}" placeholder="e.g., MacBook Pro 16" />
              <div class="invalid-feedback">Required</div>
            </div>
          </div>
        </div>

        <!-- Section: Classification -->
        <div class="form-section">
          <div class="form-section-label"><i class="bi bi-grid"></i> Classification</div>
          <div class="form-grid form-grid-3">
            <div class="form-field">
              <label for="category" class="form-label">Category <span class="text-danger">*</span></label>
              <select id="category" formControlName="category" class="form-select">
                <option *ngFor="let cat of categories" [value]="cat">{{ cat | titlecase }}</option>
              </select>
            </div>
            <div class="form-field">
              <label for="status" class="form-label">Status <span class="text-danger">*</span></label>
              <select id="status" formControlName="status" class="form-select">
                <option *ngFor="let st of statuses" [value]="st">{{ st | titlecase }}</option>
              </select>
            </div>
            <div class="form-field">
              <label for="condition" class="form-label">Condition <span class="text-danger">*</span></label>
              <select id="condition" formControlName="condition" class="form-select">
                <option *ngFor="let cond of conditions" [value]="cond">{{ cond | titlecase }}</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Section: Hardware Details -->
        <div class="form-section">
          <div class="form-section-label"><i class="bi bi-cpu"></i> Hardware Details</div>
          <div class="form-grid form-grid-3">
            <div class="form-field">
              <label for="brand" class="form-label">Brand</label>
              <input type="text" id="brand" formControlName="brand" class="form-control" placeholder="e.g., Apple" />
            </div>
            <div class="form-field">
              <label for="model" class="form-label">Model</label>
              <input type="text" id="model" formControlName="model" class="form-control" placeholder="e.g., A2141" />
            </div>
            <div class="form-field">
              <label for="serialNumber" class="form-label">Serial Number</label>
              <input type="text" id="serialNumber" formControlName="serialNumber" class="form-control" placeholder="SN-..." />
            </div>
          </div>
        </div>

        <!-- Section: Purchase & Location -->
        <div class="form-section">
          <div class="form-section-label"><i class="bi bi-receipt"></i> Purchase & Location</div>
          <div class="form-grid form-grid-4">
            <div class="form-field">
              <label for="purchaseDate" class="form-label">Purchase Date</label>
              <input type="date" id="purchaseDate" formControlName="purchaseDate" class="form-control" />
            </div>
            <div class="form-field">
              <label for="purchasePrice" class="form-label">Purchase Price</label>
              <div class="input-group">
                <span class="input-group-text">R</span>
                <input type="number" id="purchasePrice" formControlName="purchasePrice" class="form-control"
                  placeholder="0.00" step="0.01" />
              </div>
            </div>
            <div class="form-field">
              <label for="warrantyExpiry" class="form-label">Warranty Expiry</label>
              <input type="date" id="warrantyExpiry" formControlName="warrantyExpiry" class="form-control" />
            </div>
            <div class="form-field">
              <label for="location" class="form-label">Location</label>
              <input type="text" id="location" formControlName="location" class="form-control"
                placeholder="e.g., Office A, Floor 2" />
            </div>
          </div>
        </div>

        <!-- Section: Notes -->
        <div class="form-section form-section-last">
          <div class="form-section-label"><i class="bi bi-chat-left-text"></i> Notes</div>
          <div class="form-grid form-grid-2">
            <div class="form-field">
              <label for="description" class="form-label">Description</label>
              <textarea id="description" formControlName="description" class="form-control" rows="2"
                placeholder="Brief description of the asset..."></textarea>
            </div>
            <div class="form-field">
              <label for="notes" class="form-label">Additional Notes</label>
              <textarea id="notes" formControlName="notes" class="form-control" rows="2"
                placeholder="Any other notes..."></textarea>
            </div>
          </div>
        </div>

        <!-- Form Actions -->
        <div class="form-actions-bar">
          <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
          <button type="submit" class="btn btn-primary" [disabled]="isLoading$ | async">
            <span *ngIf="isLoading$ | async" class="spinner-border spinner-border-sm me-1"></span>
            {{ isEditMode ? 'Update Asset' : 'Create Asset' }}
          </button>
        </div>

      </form>
    </div>

  </div>
</section>
