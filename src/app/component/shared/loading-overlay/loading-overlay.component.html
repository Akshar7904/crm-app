<div class="loading-overlay" *ngIf="loading$ | async" aria-live="polite" role="status">
  <div class="loading-box">
    <div class="loading-ring-wrap">
      <div class="loading-ring"></div>
      <div class="loading-ring loading-ring--delay"></div>
      <img [src]="logoSrc$ | async" (error)="onLogoError($event)" alt="Loading…" class="loading-logo">
    </div>
    <p class="loading-text">Please wait…</p>
  </div>
</div>
