<aside class="sidebar"
       [class.collapsed]="collapsed"
       [class.mobile-open]="mobileOpen">

  <!-- Logo Floating Card -->
  <div class="sidebar-logo-card">
    <a routerLink="/home" class="logo-link">
      <!-- Show company logo if available, fall back to platform logo -->
      <img *ngIf="companyLogoUrl; else platformLogo"
           [src]="companyLogoUrl"
           [alt]="branding.branding?.name || companyName || 'Company'"
           class="logo-image company-logo"
           (error)="onLogoError()">
      <ng-template #platformLogo>
        <img src="../../../assets/enterprise360-icon.png" alt="Enterprise360" class="logo-image">
      </ng-template>
    </a>
    <div *ngIf="!collapsed && branding.branding?.tagline" class="sidebar-tagline">
      {{ branding.branding?.tagline }}
    </div>
  </div>

  <!-- Company Chip -->
  <div class="sidebar-company-chip" *ngIf="!collapsed && (companyName || branding.branding?.name)">
    <span class="company-chip-label">Your Company</span>
    <div class="company-chip-box">
      <span class="company-chip-dot"></span>
      <span class="company-chip-name">{{ branding.branding?.name || companyName }}</span>
    </div>
  </div>

  <!-- Menu Floating Card -->
  <div class="sidebar-menu-card">
    <nav class="sidebar-menu">
      <div class="menu-section-label" *ngIf="!collapsed">Main</div>
      <ul class="menu-list">
        <li *ngFor="let item of filteredMenuItems" class="menu-item-wrapper">

          <!-- Parent Menu Item -->
          <a class="menu-item"
             [class.active]="isActive(item.route)"
             [class.has-children]="item.children"
             [class.expanded]="item.expanded"
             (click)="toggleMenu(item)"
             [attr.title]="collapsed ? item.label : null">
            <span class="menu-icon">
              <i class="bi" [ngClass]="item.icon"></i>
            </span>
            <span class="menu-label">{{ item.label }}</span>

            <span *ngIf="item.badge?.count" class="menu-badge" [ngClass]="'badge-' + item.badge.type">
              {{ item.badge.count }}
            </span>

            <span *ngIf="item.children" class="expand-icon">
              <i class="bi" [ngClass]="item.expanded ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
            </span>
          </a>

          <!-- Submenu -->
          <ul class="submenu" *ngIf="item.children" [class.show]="item.expanded">
            <li *ngFor="let child of item.children" class="submenu-item-wrapper">
              <a class="submenu-item"
                 [class.active]="isActive(child.route)"
                 (click)="onChildClick($event, child)"
                 [attr.title]="collapsed ? child.label : null">
                <span class="menu-icon">
                  <i class="bi" [ngClass]="child.icon"></i>
                </span>
                <span class="menu-label">{{ child.label }}</span>
                <span *ngIf="child.badge?.count" class="menu-badge" [ngClass]="'badge-' + child.badge.type">
                  {{ child.badge.count }}
                </span>
              </a>
            </li>
          </ul>

        </li>
      </ul>
    </nav>
  </div>

  <!-- Footer Floating Card -->
  <div class="sidebar-footer-card">
    <div class="menu-section-label" *ngIf="!collapsed">Other</div>
    <a class="menu-item"
       routerLink="/policy"
       routerLinkActive="active"
       [attr.title]="collapsed ? 'Company Documents' : null">
      <span class="menu-icon"><i class="bi bi-file-earmark-text"></i></span>
      <span class="menu-label">Company Documents</span>
    </a>
    <a class="menu-item"
       routerLink="/documentation"
       routerLinkActive="active"
       [attr.title]="collapsed ? 'System User Guide' : null">
      <span class="menu-icon"><i class="bi bi-book"></i></span>
      <span class="menu-label">System User Guide</span>
    </a>
    <a class="menu-item"
       [routerLink]="['/profile']"
       [queryParams]="{tab: 'theme'}"
       [attr.title]="collapsed ? 'My Theme' : null">
      <span class="menu-icon"><i class="bi bi-palette2"></i></span>
      <span class="menu-label">My Theme</span>
    </a>
    <a class="logout-btn" (click)="onLogout()" [attr.title]="collapsed ? 'Logout' : null">
      <span class="menu-icon">
        <i class="bi bi-box-arrow-left"></i>
      </span>
      <span class="menu-label">Logout</span>
    </a>
  </div>

</aside>
