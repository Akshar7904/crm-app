<div class="container-fluid mt-4">
  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-header">
          <h4 class="mb-0">
            <i class="bi bi-gear me-2"></i>Process Payroll
          </h4>
        </div>
        <div class="card-body">
          <form [formGroup]="processForm">
            <div class="row mb-4">
              <div class="col-md-6">
                <label class="form-label">Pay Period Start <span class="text-danger">*</span></label>
                <input type="date" class="form-control" formControlName="payPeriodStart">
              </div>
              <div class="col-md-6">
                <label class="form-label">Pay Period End <span class="text-danger">*</span></label>
                <input type="date" class="form-control" formControlName="payPeriodEnd">
              </div>
            </div>

            <h5 class="mb-3">Select Employees</h5>
            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" [checked]="selectAll" (change)="toggleAll()" id="selectAll">
              <label class="form-check-label fw-bold" for="selectAll">
                Select All ({{ employees.length }} employees)
              </label>
            </div>

            <div class="row">
              <div class="col-md-4 mb-2" *ngFor="let employee of employees">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox"
                         [checked]="selectedEmployees.has(employee.id)"
                         (change)="toggleEmployee(employee.id)"
                         [id]="'emp-' + employee.id">
                  <label class="form-check-label" [for]="'emp-' + employee.id">
                    {{ employee.firstName }} {{ employee.lastName }} ({{ employee.employeeId }})
                  </label>
                </div>
              </div>
            </div>

            <div class="mt-4">
              <button type="button" class="btn btn-primary me-2" (click)="processPayroll()" [disabled]="isProcessing || selectedEmployees.size === 0">
                <span *ngIf="isProcessing" class="spinner-border spinner-border-sm me-2"></span>
                <i class="bi bi-check-circle me-1" *ngIf="!isProcessing"></i>
                Process {{ selectedEmployees.size }} Payroll(s)
              </button>
              <button type="button" class="btn btn-secondary" (click)="cancel()" [disabled]="isProcessing">
                <i class="bi bi-x-circle me-1"></i>Cancel
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
