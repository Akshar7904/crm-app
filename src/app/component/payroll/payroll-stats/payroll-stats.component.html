<!-- payroll-stats.component.html -->
<div class="container-fluid mt-4">
  <div class="row">
    <div class="col-12 mb-4">
      <h4><i class="bi bi-graph-up me-2"></i>Payroll Statistics</h4>
    </div>

    <div *ngIf="isLoading" class="col-12 text-center py-5">
      <div class="spinner-border text-primary"></div>
      <p class="mt-3">Loading statistics...</p>
    </div>

    <div *ngIf="!isLoading && stats" class="col-12">
      <div class="row">
        <div class="col-md-3 mb-4">
          <div class="card text-white bg-primary">
            <div class="card-body">
              <h6 class="card-title">Total Payrolls</h6>
              <h2 class="mb-0">{{ stats.totalPayrolls || 0 }}</h2>
            </div>
          </div>
        </div>
        <div class="col-md-3 mb-4">
          <div class="card text-white bg-secondary">
            <div class="card-body">
              <h6 class="card-title">Draft</h6>
              <h2 class="mb-0">{{ stats.draftPayrolls || 0 }}</h2>
            </div>
          </div>
        </div>
        <div class="col-md-3 mb-4">
          <div class="card text-white bg-info">
            <div class="card-body">
              <h6 class="card-title">Processed</h6>
              <h2 class="mb-0">{{ stats.processedPayrolls || 0 }}</h2>
            </div>
          </div>
        </div>
        <div class="col-md-3 mb-4">
          <div class="card text-white bg-success">
            <div class="card-body">
              <h6 class="card-title">Paid</h6>
              <h2 class="mb-0">{{ stats.paidPayrolls || 0 }}</h2>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
