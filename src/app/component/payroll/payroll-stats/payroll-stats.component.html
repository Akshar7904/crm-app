<div class="ann-wrap">

  <!-- Page Banner -->
  <div class="page-banner">
    <div class="banner-left">
      <h1 class="banner-title"><i class="bi bi-graph-up"></i> Payroll Statistics</h1>
      <p class="banner-subtitle">Overview of payroll processing status</p>
    </div>
  </div>

  <!-- KPI Cards -->
  <div *ngIf="stats" class="pay-kpi-row">
    <div class="pay-kpi-card">
      <div class="pay-kpi-icon pay-kpi-total"><i class="bi bi-stack"></i></div>
      <div class="pay-kpi-body">
        <div class="pay-kpi-label">Total Payrolls</div>
        <div class="pay-kpi-value">{{ stats.totalPayrolls || 0 }}</div>
      </div>
    </div>
    <div class="pay-kpi-card">
      <div class="pay-kpi-icon pay-kpi-draft"><i class="bi bi-file-earmark-text"></i></div>
      <div class="pay-kpi-body">
        <div class="pay-kpi-label">Draft</div>
        <div class="pay-kpi-value">{{ stats.draftPayrolls || 0 }}</div>
      </div>
    </div>
    <div class="pay-kpi-card">
      <div class="pay-kpi-icon pay-kpi-processed"><i class="bi bi-gear-fill"></i></div>
      <div class="pay-kpi-body">
        <div class="pay-kpi-label">Processed</div>
        <div class="pay-kpi-value">{{ stats.processedPayrolls || 0 }}</div>
      </div>
    </div>
    <div class="pay-kpi-card">
      <div class="pay-kpi-icon pay-kpi-paid"><i class="bi bi-check-circle-fill"></i></div>
      <div class="pay-kpi-body">
        <div class="pay-kpi-label">Paid</div>
        <div class="pay-kpi-value">{{ stats.paidPayrolls || 0 }}</div>
      </div>
    </div>
  </div>

</div>
