<!-- Main App Container -->
<div class="app-container"
     [class.sidebar-collapsed]="sidebarCollapsed"
     [class.sidebar-open]="sidebarOpen"
     [class.layout-topnav]="(layoutMode$ | async) === 'topnav'">
  <!-- Show dashboard layout only for authenticated users on non-public routes -->
  <ng-container *ngIf="!isPublicRoute && isAuthenticated && (user$ | async) as user; else unauthenticated">

    <ng-container *ngIf="(layoutMode$ | async) === 'topnav'; else sidebarShell">

      <!-- Top Nav Shell -->
      <app-topnav
        [user]="user"
        [mobileOpen]="sidebarOpen"
        (toggleMobileMenu)="toggleSidebar()"
        (closeMobileMenu)="closeSidebar()">
      </app-topnav>

      <div class="main-content-wrapper main-content-wrapper--topnav">
        <div class="content-area">
          <div class="container-fluid py-4">
            <router-outlet></router-outlet>
          </div>
        </div>
      </div>

    </ng-container>

    <ng-template #sidebarShell>

      <!-- Sidebar -->
      <app-sidebar
        [user]="user"
        [collapsed]="sidebarCollapsed"
        [mobileOpen]="sidebarOpen"
        (closeMobileSidebar)="closeSidebar()">
      </app-sidebar>

      <!-- Mobile Overlay -->
      <div class="sidebar-overlay"
           *ngIf="sidebarOpen && isMobile"
           (click)="closeSidebar()">
      </div>

      <!-- Main Content Wrapper -->
      <div class="main-content-wrapper">
        <!-- Navbar -->
        <app-navbar
          [user]="user"
          [sidebarCollapsed]="sidebarCollapsed"
          (toggleSidebar)="toggleSidebar()">
        </app-navbar>

        <!-- Main Content -->
        <div class="content-area">
          <div class="container-fluid py-4">
            <router-outlet></router-outlet>
          </div>
        </div>
      </div>

    </ng-template>

    <!-- Mobile Bottom Navigation (LinkedIn-style, phones only) -->
    <nav class="mobile-bottom-nav">
      <a class="mobile-bottom-item" routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">
        <i class="bi bi-house-door"></i>
        <span>Home</span>
      </a>
      <a class="mobile-bottom-item" routerLink="/attendance/my" routerLinkActive="active">
        <i class="bi bi-clock-history"></i>
        <span>Attendance</span>
      </a>
      <a class="mobile-bottom-item"
         [routerLink]="isAdminUser(user) ? '/announcements/admin' : '/announcements'"
         routerLinkActive="active">
        <i class="bi bi-megaphone"></i>
        <span>News</span>
      </a>
      <a class="mobile-bottom-item" routerLink="/notifications" routerLinkActive="active">
        <i class="bi bi-bell"></i>
        <span>Alerts</span>
      </a>
      <button class="mobile-bottom-item" (click)="toggleSidebar()">
        <i class="bi bi-grid-3x3-gap"></i>
        <span>Menu</span>
      </button>
    </nav>

  </ng-container>

  <!-- Unauthenticated View (Login/Register pages) -->
  <ng-template #unauthenticated>
    <router-outlet></router-outlet>
  </ng-template>
</div>

<!-- Toast Notifications Container -->
<notifier-container></notifier-container>

<!-- Global logo loading overlay -->
<app-loading-overlay></app-loading-overlay>
