<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LKCentrix Solutions </title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" href="assets/logo_icon.png">
  <style>
    .app-boot-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100%;
      background: #1a2a4a;
    }
    .loader {
      display: inline-block;
      font-size: 48px;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: bold;
      color: #fff;
      position: relative;
    }
    .loader::before {
      content: '';
      position: absolute;
      left: 34px;
      bottom: 8px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 5px solid #fff;
      border-bottom-color: #375fa0;
      box-sizing: border-box;
      animation: rotation 0.6s linear infinite;
    }
    @keyframes rotation {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="d-flex flex-column h-100">
  <main class="flex-shrink-0">
    <app-root>
      <div class="app-boot-wrap">
        <span class="loader">L &nbsp; ading</span>
      </div>
    </app-root>
  </main>
</body>
</html>
